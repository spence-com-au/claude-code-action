---
version: 2

updates:
  - package-ecosystem: 'github-actions'
    directories:
      - '/'
      - '/code-review'
      - '/mention'
    schedule:
      interval: 'weekly'
    groups:
      claude-code-action:
        patterns:
          - 'anthropics/claude-code-action'
        group-by: 'dependency-name'
