---
name: 'Dependabot'

on:
  pull_request: {}

permissions:
  contents: 'write'
  pull-requests: 'write'

jobs:
  automerge:
    name: 'Automerge'
    if: "github.event.pull_request.user.login == 'dependabot[bot]'"
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Fetch the update metadata'
        id: 'metadata'
        uses: 'dependabot/fetch-metadata@v2'

      # Callers use the actions at `@master`, so a merged update reaches every one of them on its next run. A major
      # bump can change the upstream behaviour the actions rely on, so it waits for a review instead.
      - name: 'Merge the update'
        if: "steps.metadata.outputs.update-type != 'version-update:semver-major'"
        run: 'gh pr merge --auto --squash "${PR_URL}"'
        env:
          GH_TOKEN: '${{ github.token }}'
          PR_URL: '${{ github.event.pull_request.html_url }}'
