---
name: 'Lint'

on:
  pull_request: {}
  push:
    branches:
      - 'master'

permissions:
  contents: 'read'

jobs:
  actionlint:
    name: 'actionlint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'

      - name: 'Lint the workflows'
        uses: 'raven-actions/actionlint@v2'

  yamllint:
    name: 'yamllint'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7'

      - name: 'Lint the YAML'
        run: 'yamllint --format github --strict .'
