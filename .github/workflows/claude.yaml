---
name: 'Claude'

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: 'OAuth token Claude works with, from `claude setup-token`.'
        required: true

# No permissions by default.
permissions: {}

# The job checks out the action at the commit this workflow was called at, so the two cannot drift apart. `uses` takes
# no expression, and the checkout sits in the caller's workspace because a local action must.
#
# The action logs the session's messages only when `ACTIONS_STEP_DEBUG` is in its environment, which re-running a job
# with debug logging does not put there, so the job passes `runner.debug` on. The caller's log carries the transcript,
# tool results included, and is public wherever the caller is.
jobs:
  review:
    name: 'Review'

    # A called workflow sees the caller's `github` context, so on any event but a pull request the review is skipped
    # without starting a runner.
    #
    # A run that Dependabot triggers is passed no secrets, nor is one from a fork, so its review would be refused a
    # token and fail. That turns on who triggered the run rather than who opened the pull request: a person who pushes
    # to a Dependabot branch is passed them.
    if: |
      github.event_name == 'pull_request' && !github.event.pull_request.draft &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: 'ubuntu-latest'

    # A push supersedes the review running against the commit before it. This is on the job rather than the workflow,
    # where it could collide with a group the caller sets.
    concurrency:
      cancel-in-progress: true
      group: 'claude-review-${{ github.event.pull_request.number }}'

    permissions:
      contents: 'read'
      id-token: 'write'
      pull-requests: 'write'

    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v7.0.1'

      - name: 'Checkout the actions'
        uses: 'actions/checkout@v7.0.1'
        with:
          path: '.claude-code-action'
          ref: '${{ job.workflow_sha }}'
          repository: '${{ job.workflow_repository }}'

      - name: 'Hide the actions from Git'
        run: 'echo "/.claude-code-action/" >> .git/info/exclude'

      - name: 'Review the pull request'
        uses: './.claude-code-action/code-review'
        with:
          claude_code_oauth_token: '${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}'
          show_full_output: '${{ runner.debug == ''1'' }}'
